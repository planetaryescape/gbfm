name: Find matching gbpm binaries
description: Restore and verify the packaged target set for the checked-out Rust build inputs
outputs:
  cache-hit:
    description: Whether all packaged targets were restored for these exact inputs
    value: ${{ steps.binaries.outputs.cache-hit }}
  cache-key:
    description: Exact cache key for this packaged target set
    value: ${{ steps.binaries.outputs.cache-primary-key }}
  source-sha:
    description: Checked-out source commit
    value: ${{ steps.source.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Record the source commit
      id: source
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Restore packaged binaries for these build inputs
      id: binaries
      uses: actions/cache/restore@v5
      with:
        path: dist/gbpm-*.tar.gz
        key: gbpm-binaries-v2-${{ hashFiles('tools/process-mix/**', '.github/workflows/rust-build.yml', '.github/actions/gbpm-binaries/action.yml', '.cargo/**', 'rust-toolchain*') }}

    - name: Verify the cached target set
      if: steps.binaries.outputs.cache-hit == 'true'
      shell: bash
      run: |
        for target in linux-x86_64 linux-aarch64 darwin-aarch64; do
          test -s "dist/gbpm-$target.tar.gz"
        done
