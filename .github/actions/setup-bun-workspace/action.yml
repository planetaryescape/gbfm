name: Setup Bun Workspace
description: Setup Node, Bun, cache dependencies, and install
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'

    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: 'package.json'

    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/bun-install-cache
        key: bun-install-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --cache-dir "${{ runner.temp }}/bun-install-cache"
