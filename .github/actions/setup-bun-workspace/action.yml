name: Setup Bun Workspace
description: Setup Node, Bun, and install dependencies
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: 'package.json'

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --cache-dir "${{ runner.temp }}/bun-install-cache"
