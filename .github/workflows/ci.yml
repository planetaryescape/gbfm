name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run OXC checks
        run: bun run oxc:ci

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Type check all packages
        run: bun run typecheck

  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run unit and integration tests
        run: bun run test

      - name: Run WWW unit and integration tests
        run: bun run test:www

  build-www:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Build www package
        run: cd apps/www && bun run build

  observability-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Install fixture browsers
        working-directory: apps/www
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify browser observability transport
        working-directory: apps/www
        run: bun run e2e:observability
