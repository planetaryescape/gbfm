name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run OXC checks
        run: bun run oxc:ci

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Type check all packages
        run: bun run typecheck

  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run unit and integration tests
        run: bun run test:packages

      - name: Run WWW unit and integration tests
        run: bun run test:www

  tests-d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run D1 integration tests
        working-directory: apps/server
        run: bun run test:d1 --shard=${{ matrix.shard }}/2

  build-www:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Build www package
        run: cd apps/www && bun run build

  observability-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Verify browser observability transport
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env CI=true \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            --workdir "$GITHUB_WORKSPACE/apps/www" \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f \
            bun run e2e:observability
