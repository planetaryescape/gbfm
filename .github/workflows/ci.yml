name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run OXC checks
        run: bun run oxc:ci

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Type check all packages
        run: bun run typecheck

  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run unit and integration tests
        run: bun run test:packages

      - name: Run WWW unit and integration tests
        run: bun run test:www

  tests-d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run D1 integration tests
        working-directory: apps/server
        run: bun run test:d1 --shard=${{ matrix.shard }}/2

  build-www:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Build www package
        run: cd apps/www && bun run build

  observability-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Verify browser observability transport
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env CI=true \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            --workdir "$GITHUB_WORKSPACE/apps/www" \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f \
            bun run e2e:observability

  effect-ui-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [fixture, app]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Build native hosting fixture
        if: matrix.target == 'fixture'
        working-directory: apps/www
        run: bun run vite build --config test/effect-ui.fixture.config.ts

      - name: Build native application
        if: matrix.target == 'app'
        working-directory: apps/www
        env:
          SENTRY_UPLOAD_SOURCEMAPS: 'false'
        run: bun run build

      - name: Verify native production workerd responses
        working-directory: apps/www
        run: bun scripts/effect-ui-workerd.ts ${{ matrix.target == 'fixture' && '--fixture' || '' }}

      - name: Verify native SSR and browser adoption
        env:
          GBFM_EFFECT_APP: ${{ matrix.target == 'app' && '1' || '0' }}
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env CI=true \
            --env HOME=/tmp \
            --env GBFM_EFFECT_APP \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            --workdir "$GITHUB_WORKSPACE/apps/www" \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f \
            bun run playwright test --config test/playwright.effect-ui.config.ts

      - name: Verify textarea hydration and pre-hydration edits
        if: matrix.target == 'app'
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env CI=true \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            --workdir "$GITHUB_WORKSPACE/apps/www" \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f \
            bun run playwright test --config test/hydration-textarea.playwright.config.ts

      - name: Verify native editor and import controls
        if: matrix.target == 'app'
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env CI=true \
            --env HOME=/tmp \
            --env PLAYWRIGHT_BASE_URL=http://127.0.0.1:4175 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            --workdir "$GITHUB_WORKSPACE/apps/www" \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f \
            bun run playwright test e2e/creator-editor-dom.spec.ts e2e/listening-import-dom.spec.ts --project="Mobile Chrome" --workers=1 --retries=0

      - name: Verify pending seek ownership
        if: matrix.target == 'app'
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env CI=true \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            --workdir "$GITHUB_WORKSPACE/apps/www" \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f \
            bun run playwright test --config test/player-home-touch.playwright.config.ts

      - name: Verify native Dashboard query and dialog ownership
        if: matrix.target == 'app'
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env CI=true \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            --workdir "$GITHUB_WORKSPACE/apps/www" \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f \
            bun run playwright test --config test/dashboard-retirement.playwright.config.ts
