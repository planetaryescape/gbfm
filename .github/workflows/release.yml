name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      benchmark_cache:
        description: Benchmark dependency caches only; skip validation, release and deployment
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-cache:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark_cache
    permissions:
      contents: read
    uses: ./.github/workflows/ci-benchmark.yml

  lint:
    if: ${{ !inputs.benchmark_cache }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run OXC checks
        run: bun run oxc:ci

  typecheck:
    if: ${{ !inputs.benchmark_cache }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Type check all packages
        run: bun run typecheck

  tests:
    if: ${{ !inputs.benchmark_cache }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run unit and integration tests
        run: bun run test:packages

      - name: Run WWW unit and integration tests
        run: bun run test:www

  tests-d1:
    if: ${{ !inputs.benchmark_cache }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run D1 integration tests
        working-directory: apps/server
        run: bun run test:d1 --shard=${{ matrix.shard }}/2

  build-www:
    if: ${{ !inputs.benchmark_cache }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Build www package
        env:
          APP_RELEASE: ${{ github.sha }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN }}
          VITE_SENTRY_ENABLED: 'true'
          VITE_SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/prod' && 'production' || 'preview' }}
          SENTRY_UPLOAD_SOURCEMAPS: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: cd apps/www && bun run build

  observability-browser:
    if: ${{ !inputs.benchmark_cache }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Verify browser observability transport
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env CI=true \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bun:ro" \
            --volume "$(realpath "$(command -v bun)"):/usr/local/bin/bunx:ro" \
            --workdir "$GITHUB_WORKSPACE/apps/www" \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f \
            bun run e2e:observability

  release:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, tests, tests-d1, build-www, observability-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-bun-workspace

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bunx semantic-release

      - name: Record the Rust binary release target
        run: |
          git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD > gbpm-release-tag.txt
          git rev-parse HEAD > gbpm-source-sha.txt

      - name: Publish the Rust binary release target
        uses: actions/upload-artifact@v4
        with:
          name: gbpm-release-target
          path: |
            gbpm-release-tag.txt
            gbpm-source-sha.txt
          retention-days: 7

      - name: Trigger Prod Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run alchemy-deploy.yml --ref=prod
