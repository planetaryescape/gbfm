name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run OXC checks
        run: bun run oxc:ci

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Type check all packages
        run: bun run typecheck

  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Run unit and integration tests
        run: bun run test

      - name: Run WWW unit and integration tests
        run: bun run test:www

  build-www:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Build www package
        env:
          APP_RELEASE: ${{ github.sha }}
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN }}
          VITE_SENTRY_ENABLED: 'true'
          VITE_SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/prod' && 'production' || 'preview' }}
          SENTRY_UPLOAD_SOURCEMAPS: 'true'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: cd apps/www && bun run build

  observability-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun-workspace

      - name: Install fixture browsers
        working-directory: apps/www
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify browser observability transport
        working-directory: apps/www
        run: bun run e2e:observability

  release:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, tests, build-www, observability-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-bun-workspace

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bunx semantic-release

      - name: Trigger Prod Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run alchemy-deploy.yml --ref=prod
